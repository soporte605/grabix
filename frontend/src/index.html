<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Grabix · Sistema para talleres de corte láser y sublimación</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Cotiza, vende y controla tu inventario de corte láser y sublimación. Simulador de precios gratis.">
  <meta name="theme-color" content="#002150">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-180.png">
  <script>
    // Aplica el modo claro/oscuro guardado antes de pintar, para que no parpadee.
    try { var t = localStorage.getItem('grabix.tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Pantalla de arranque: se ve mientras carga la app y Angular la reemplaza al iniciar. -->
  <app-root>
    <div class="arranque" role="status" aria-label="Cargando Grabix">
      <svg class="logo-carga" width="84" height="84" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#002150"/><path d="M43.3 21.4A15.5 15.5 0 1 0 47.5 33H33.5" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path class="g" pathLength="100" d="M43.3 21.4A15.5 15.5 0 1 0 47.5 33H33.5" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><g opacity="0"><set attributeName="opacity" to="1" fill="freeze"></set><circle class="halo" r="6" fill="#67BE28" opacity=".4"/><circle r="3.6" fill="#67BE28"/><animateMotion dur="1.8s" repeatCount="indefinite" keyPoints="0;1;1;1" keyTimes="0;.6;.85;1" calcMode="spline" keySplines=".65 0 .35 1;0 0 1 1;0 0 1 1" path="M43.3 21.4A15.5 15.5 0 1 0 47.5 33H33.5"/></g></svg>
      <span class="arranque-txt">Grabix</span>
    </div>
  </app-root>
  <style>
    .arranque { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; background: #f2f5f8; }
    @media (prefers-color-scheme: dark) { html:not([data-tema=claro]) .arranque { background: #0b1220; } }
    html[data-tema=oscuro] .arranque { background: #0b1220; }
    .arranque .logo-carga { border-radius: 19px; box-shadow: 0 14px 38px rgba(0, 33, 80, .28); }
    .arranque-txt { font: 700 15px/1 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: .02em; color: #5b6878; }
    .arranque .g { stroke-dasharray: 100; animation: arranque-cortar 1.8s cubic-bezier(.65, 0, .35, 1) infinite; }
    .arranque .halo { transform-box: fill-box; transform-origin: center; animation: arranque-halo 1.8s ease-in-out infinite; }
    @keyframes arranque-cortar { 0% { stroke-dashoffset: 100; } 60%, 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: .25; } }
    @keyframes arranque-halo { 0%, 100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.9); opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { .arranque .g { animation: none; stroke-dashoffset: 0; } .arranque .halo { animation: none; } }
  </style>
</body>
</html>
