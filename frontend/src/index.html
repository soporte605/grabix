<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Grabix · Sistema para talleres de corte láser y sublimación</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Cotiza, vende y controla tu inventario de corte láser y sublimación. Simulador de precios gratis.">
  <meta name="theme-color" content="#002150">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-180.png">
  <script>
    // Aplica el modo claro/oscuro guardado antes de pintar, para que no parpadee.
    try { var t = localStorage.getItem('grabix.tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Pantalla de arranque: se ve mientras carga la app y Angular la reemplaza al iniciar. -->
  <app-root>
    <div class="arranque" role="status" aria-label="Cargando Grabix">
      <div class="arranque-logo">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#002150"/><path class="arranque-g" d="M43.3 21.4A15.5 15.5 0 1 0 47.5 33H33.5" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/><path d="M43.3 6.5v11" stroke="#67BE28" stroke-width="3" stroke-linecap="round"/><circle cx="43.3" cy="21.4" r="4.6" fill="#67BE28"/><circle class="arranque-brillo" cx="43.3" cy="21.4" r="8" fill="#67BE28" opacity=".22"/></svg>
      </div>
      <div class="arranque-barra"><span></span></div>
    </div>
  </app-root>
  <style>
    .arranque { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; background: #f2f5f8; }
    @media (prefers-color-scheme: dark) { html:not([data-tema=claro]) .arranque { background: #0b1220; } }
    html[data-tema=oscuro] .arranque { background: #0b1220; }
    .arranque-logo svg { width: 72px; height: 72px; border-radius: 17px; box-shadow: 0 12px 34px rgba(0, 33, 80, .28); }
    .arranque-g { stroke-dasharray: 100; animation: arranque-corte 1.4s ease-in-out infinite; }
    .arranque-brillo { transform-origin: 43.3px 21.4px; animation: arranque-pulso 1.4s ease-in-out infinite; }
    .arranque-barra { width: 132px; height: 4px; border-radius: 4px; background: rgba(103, 190, 40, .2); overflow: hidden; }
    .arranque-barra span { display: block; width: 40%; height: 100%; border-radius: 4px; background: #67be28; animation: arranque-barra 1.1s ease-in-out infinite; }
    @keyframes arranque-corte { 0% { stroke-dashoffset: 100; } 55%, 100% { stroke-dashoffset: 0; } }
    @keyframes arranque-pulso { 0%, 100% { transform: scale(1); opacity: .22; } 50% { transform: scale(1.5); opacity: .45; } }
    @keyframes arranque-barra { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .arranque-g, .arranque-brillo, .arranque-barra span { animation: none; } }
  </style>
</body>
</html>
