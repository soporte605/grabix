# Levanta todo con:  docker compose up -d --build
# Web:  http://localhost:8080   ·   API: http://localhost:8080/api   ·   Correos de prueba (Mailpit): http://localhost:8025
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-grabix}
      MYSQL_USER: ${DB_USER:-grabix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-grabix}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - datos:/var/lib/mysql
    ports:
      - "${DB_PUERTO_LOCAL:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-grabix}", "-p${DB_PASSWORD:-grabix}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-grabix}
      DB_USER: ${DB_USER:-grabix}
      DB_PASSWORD: ${DB_PASSWORD:-grabix}
      DB_SYNC: ${DB_SYNC:-true}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      PAGOS_MODO: ${PAGOS_MODO:-demo}
      # Correo: con RESEND_API_KEY se usa Resend; si no, el SMTP (por defecto Mailpit, que no entrega a nadie).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Grabix <no-responder@grabix.local>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Asistente con IA (Claude). Sin ANTHROPIC_API_KEY el asistente se muestra como "no configurado".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASISTENTE_MODELO: ${ASISTENTE_MODELO:-claude-opus-5-5}
      ASISTENTE_LIMITE_DIARIO: ${ASISTENTE_LIMITE_DIARIO:-}
      COTIZADOR_LIMITE: ${COTIZADOR_LIMITE:-3}

  # Bandeja de pruebas: atrapa todos los correos que manda la API y los muestra en el navegador.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_PUERTO:-8025}:8025"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PUERTO:-8080}:80"

volumes:
  datos:
