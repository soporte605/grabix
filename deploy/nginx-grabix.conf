# nginx del servidor (fuera de Docker) para Grabix. Cambia grabix.com.mx por tu dominio.
# Copia a /etc/nginx/sites-available/grabix, enlázalo en sites-enabled, prueba con "nginx -t" y luego:
#   certbot --nginx -d grabix.com.mx -d app.grabix.com.mx -d admin.grabix.elikarsystems.com
# Si también usas www, agrégalo a server_name y a certbot (necesita su registro DNS).
# certbot agrega solo los bloques de HTTPS y la redirección desde http.

# Landing
server {
    listen 80;
    server_name grabix.com.mx;
    client_max_body_size 10m;

    # Cuenta y sistema viven en app.
    location ~ ^/(app|entrar|registro|verificar-correo|olvide-contrasena|restablecer-contrasena|invitacion)(/|$) {
        return 302 https://app.grabix.com.mx$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Sistema
server {
    listen 80;
    server_name app.grabix.com.mx;
    client_max_body_size 10m;

    location = / { return 302 /entrar; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Super administrador (host fijo)
server {
    listen 80;
    server_name admin.grabix.elikarsystems.com;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
